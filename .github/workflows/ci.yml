name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo no mesmo branch cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest

    # PostgreSQL real para os testes de integração (persistência, casos de uso e API).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TASKFLOW_TEST_CONNECTION: Host=localhost;Port=5432;Database=taskflow_tests;Username=taskflow;Password=taskflow
      # S3 compatível (SeaweedFS) para os testes de contrato do armazenamento de anexos.
      TASKFLOW_TEST_S3_URL: http://localhost:8333
      TASKFLOW_TEST_S3_ACCESS_KEY: ci
      TASKFLOW_TEST_S3_SECRET_KEY: ci-only-secret-key
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Não dá para usar "services" aqui: o SeaweedFS precisa de argumentos e do arquivo de credenciais.
      - name: S3 local (SeaweedFS)
        run: |
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"ci","secretKey":"ci-only-secret-key"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
          docker run -d --name s3 -p 8333:8333 -v /tmp/s3.json:/s3.json --entrypoint weed chrislusf/seaweedfs:4.48 server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=100 -volume.max=0 -s3 -s3.port=8333 -s3.config=/s3.json
          # Pronto = responde 403 (pede credencial); antes disso a porta aceita conexão mas corta a resposta.
          for _ in $(seq 1 120); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333)" = "403" ] && exit 0
            sleep 1
          done
          # Não ficou pronto: falha aqui, com o log do SeaweedFS, em vez de deixar os testes quebrarem depois.
          echo "::error title=SeaweedFS não ficou pronto::última resposta: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8333)"
          docker ps -a --filter name=s3
          docker logs s3 2>&1 | tail -60
          exit 1

      - name: Restore
        run: dotnet restore backend/TaskFlow.sln

      - name: Build
        run: dotnet build backend/TaskFlow.sln -c Release --no-restore

      - name: Test
        run: dotnet test backend/TaskFlow.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      # O log do job só é visível com login; anotações aparecem para todos (inclusive pela API pública).
      - name: Testes que falharam como anotações
        if: failure()
        run: |
          python3 - <<'EOF'
          import glob, re, xml.etree.ElementTree as ET
          ns = {'t': 'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          for path in glob.glob('tests/**/TestResults/*.trx', recursive=True):
              for r in ET.parse(path).getroot().iterfind('.//t:UnitTestResult', ns):
                  if r.get('outcome') != 'Failed':
                      continue
                  message = r.findtext('.//t:Message', default='', namespaces=ns)
                  stack = r.findtext('.//t:StackTrace', default='', namespaces=ns)
                  text = re.sub(r'\s+', ' ', f'{message} | {stack}')[:1500]
                  print(f"::error title={r.get('testName')}::{text}")
          EOF

      - name: Publicar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/taskflow-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/taskflow-web/package-lock.json

      - run: npm ci
      - run: npm run lint
      # tsc -b (checagem de tipos) + vite build
      - run: npm run build

  android:
    name: Android (testes + lint + APK)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile/taskflow-android

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      # APK de debug apontando para o emulador (10.0.2.2:3200), para instalar e testar com a stack local.
      - uses: actions/upload-artifact@v4
        with:
          name: taskflow-android-debug
          path: mobile/taskflow-android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  docker:
    name: Docker (build + smoke test + E2E + publicação)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build das imagens
        run: docker compose build

      # Sobe a stack completa como um usuário faria e testa através do nginx.
      - name: Smoke test da stack completa
        env:
          JWT_SECRET: ${{ github.run_id }}-ci-only-secret-not-used-anywhere-else
          WEB_PORT: 3000
        run: |
          docker compose up -d

          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/health | grep -q Healthy

          # Rota do SPA servida pelo nginx.
          curl -fsS http://localhost:3000/projects > /dev/null

          # Sem token: 401.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/projects)" = "401"

          # Cadastro devolve um token e o token dá acesso à API.
          TOKEN=$(curl -fsS -X POST http://localhost:3000/api/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@taskflow.test","password":"ci-smoke-test-123"}' | jq -r .accessToken)
          curl -fsS http://localhost:3000/api/projects -H "Authorization: Bearer $TOKEN" > /dev/null

      # Testes de ponta a ponta no navegador contra a mesma stack (nginx -> API -> PostgreSQL).
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Testes E2E (Playwright)
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Relatório dos testes E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar a stack
        if: always()
        run: docker compose down -v

      - name: Login no GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags previsíveis (seção 48): latest e o SHA do commit.
      - name: Publicar imagens
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA=${GITHUB_SHA::7}
          for IMAGE in taskflow-api taskflow-web; do
            for TAG in latest "$SHA"; do
              docker tag "$IMAGE" "ghcr.io/$OWNER/$IMAGE:$TAG"
              docker push "ghcr.io/$OWNER/$IMAGE:$TAG"
            done
          done
