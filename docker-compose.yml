# Uso:
#   cp .env.example .env      (e defina JWT_SECRET)
#   docker compose up -d --build
#
# Só o banco, para desenvolvimento local com dotnet run / npm run dev:
#   docker compose up -d postgres

services:

  postgres:
    image: postgres:16
    container_name: taskflow-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taskflow}

    # Exposto no host só para desenvolvimento (dotnet run, ferramentas de banco).
    ports:
      - "${POSTGRES_PORT:-5436}:5432"

    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    image: taskflow-api
    container_name: taskflow-api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=taskflow;Username=taskflow;Password=${POSTGRES_PASSWORD:-taskflow}
      # Sem valor padrão de propósito: a API recusa iniciar com segredo ausente ou curto (< 32 caracteres).
      Jwt__Secret: ${JWT_SECRET:-}
      Database__ApplyMigrationsOnStartup: "true"
      # Swagger ligado porque este compose é o ambiente de demonstração local.
      Swagger__Enabled: "true"
      # 8080 = API; 9090 = /metrics, só dentro da rede Docker (não publicada no host).
      ASPNETCORE_HTTP_PORTS: "8080;9090"
      Metrics__Port: "9090"
      # Anexos: Local (volume abaixo) ou S3 (SeaweedFS do perfil "s3"; na AWS, ServiceUrl vazia e o bucket real).
      Storage__Provider: ${STORAGE_PROVIDER:-Local}
      Storage__S3__ServiceUrl: http://s3:8333
      Storage__S3__Bucket: taskflow-attachments
      Storage__S3__AccessKey: ${S3_ACCESS_KEY:-taskflow}
      Storage__S3__SecretKey: ${S3_SECRET_KEY:-}
      # Antivírus: vazio = desligado; "clamav" = verifica cada anexo no ClamAV do perfil "antivirus".
      Antivirus__Host: ${ANTIVIRUS_HOST:-}
      Attachments__ProjectQuotaMb: ${PROJECT_QUOTA_MB:-100}

    ports:
      - "${API_PORT:-8080}:8080"

    # Anexos das tarefas.
    volumes:
      - taskflow_attachments:/app/data

    networks:
      - backend
      - frontend

  web:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    image: taskflow-web
    container_name: taskflow-web
    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "${WEB_PORT:-3000}:8080"

    networks:
      - frontend

  # Armazenamento S3 local (SeaweedFS, compatível com S3): docker compose --profile s3 up -d, com STORAGE_PROVIDER=S3
  # no .env. Porta só em 127.0.0.1 (testes de integração); a API fala com ele pela rede interna.
  # A credencial é montada a partir do .env na subida (o SeaweedFS lê as chaves de um JSON).
  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: taskflow-s3
    profiles: [s3]
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-taskflow}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"taskflow","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        && exec weed server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - taskflow_s3_data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    networks:
      - backend

  # Antivírus (ClamAV): docker compose --profile antivirus up -d, com ANTIVIRUS_HOST=clamav no .env.
  # Pesado (~1 GB de memória) e leva alguns minutos para baixar as assinaturas na primeira vez.
  clamav:
    image: clamav/clamav:1.4
    container_name: taskflow-clamav
    profiles: [antivirus]
    restart: unless-stopped
    volumes:
      - taskflow_clamav_data:/var/lib/clamav
    ports:
      - "127.0.0.1:${CLAMAV_PORT:-3310}:3310"
    networks:
      - backend

  # Observabilidade: sobe só com  docker compose --profile observability up -d
  # Portas presas a 127.0.0.1: o Prometheus não tem autenticação e não deve ficar exposto na rede.

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: taskflow-prometheus
    profiles: [observability]
    restart: unless-stopped

    depends_on:
      - api

    volumes:
      - ./docker/prometheus:/etc/prometheus:ro
      - taskflow_prometheus_data:/prometheus

    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

    networks:
      - backend
      - monitoring

  grafana:
    image: grafana/grafana:11.3.0
    container_name: taskflow-grafana
    profiles: [observability]
    restart: unless-stopped

    depends_on:
      - prometheus

    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Sem GRAFANA_PASSWORD no .env vale o padrão do Grafana, que obriga a trocar no primeiro login.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/taskflow.json

    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - taskflow_grafana_data:/var/lib/grafana

    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"

    networks:
      - monitoring

# O frontend não enxerga o banco: só a API está nas duas redes.
# O Grafana só fala com o Prometheus; só o Prometheus alcança a porta de métricas da API.
networks:
  backend:
  frontend:
  monitoring:

volumes:
  taskflow_postgres_data:
  taskflow_attachments:
  taskflow_s3_data:
  taskflow_clamav_data:
  taskflow_prometheus_data:
  taskflow_grafana_data:
