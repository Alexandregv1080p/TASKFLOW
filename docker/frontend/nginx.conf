server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Mesma origem para o navegador: /api vai para o container da API (sem CORS).
    location /api/ {
        proxy_pass http://api:8080;
        # Anexos de até 10 MB (o padrão do nginx é 1 MB); a API aplica o limite real.
        client_max_body_size 11m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (tempo real do quadro): precisa do upgrade para WebSocket e de uma conexão que fique aberta.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        # O token vai na query do WebSocket: não registrar essa URL no log de acesso.
        access_log off;
    }

    location = /health {
        proxy_pass http://api:8080;
    }

    # Arquivos do build do Vite têm hash no nome: cache longo é seguro.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA: qualquer rota desconhecida devolve o index.html (React Router resolve).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
